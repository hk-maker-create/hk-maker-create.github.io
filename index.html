<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expiry Tracker</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
    button { padding: 12px 20px; margin: 10px; font-size: 16px; border-radius: 8px; border: none; background: #007bff; color: white; cursor: pointer; }
    .view { display: none; }
    .view.active { display: block; }
    #reader { width: 100%; max-width: 400px; margin: 20px auto; background: #222; }
    #result { margin-top: 15px; font-weight: bold; color: #4caf50; }
  </style>
</head>
<body>
  <h1>Expiry Tracker</h1>

  <!-- Home / Notification View -->
  <div id="home-view" class="view active">
    <button onclick="enableNotifications()">Enable Notifications</button>
    <br>
    <button onclick="showScannerView()">Open Barcode Scanner</button>
  </div>

  <!-- Scanner View -->
  <div id="scanner-view" class="view">
    <button onclick="showHomeView()">← Back to Home</button>
    <div id="reader"></div>
    <div id="result"></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
