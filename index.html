<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expiry Tracker</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }

    #reader { width: 100%; max-width: 400px; margin: 20px auto; background: #222; display: none; }

<body>
  <h1>Expiry Tracker</h1>
  <button onclick="enableNotifications()">Enable Notifications</button>

  <div id="result"></div>

  <script src="./app.js"></script>

</html>
