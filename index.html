<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expiry Tracker</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; text-align: center; }
    .container { max-width: 500px; margin: 0 auto; }
    button { padding: 12px 20px; margin: 8px; font-size: 16px; border-radius: 8px; border: none; background: #007bff; color: white; cursor: pointer; }
    button.secondary { background: #6c757d; }
    input, select { padding: 10px; margin: 8px; width: 80%; max-width: 300px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; font-size: 16px; }
    .view { display: none; }
    .view.active { display: block; }
    #reader { width: 100%; max-width: 400px; margin: 20px auto; background: #222; }
    .item-card { background: #1e1e1e; padding: 12px; margin: 10px 0; border-radius: 8px; border-left: 5px solid #007bff; text-align: left; display: flex; justify-content: space-between; align-items: center; }
    .item-info h4 { margin: 0 0 5px 0; }
    .item-info p { margin: 0; font-size: 14px; color: #aaa; }
    .delete-btn { background: #dc3545; padding: 6px 12px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Expiry Tracker</h1>

    <!-- Home View: Saved Items & Actions -->
    <div id="home-view" class="view active">
      <button onclick="showScannerView()">📷 Scan Barcode</button>
      <button class="secondary" onclick="showAddView()">➕ Add Manually</button>
      <button class="secondary" onclick="enableNotifications()">🔔 Enable Notifications</button>
      
      <h3>Tracked Items</h3>
      <div id="item-list"></div>
    </div>

    <!-- Scanner View -->
    <div id="scanner-view" class="view">
      <button class="secondary" onclick="showHomeView()">← Back</button>
      <div id="reader"></div>
    </div>

    <!-- Add / Edit Item View -->
    <div id="add-view" class="view">
      <button class="secondary" onclick="showHomeView()">← Back</button>
      <h3>Product Details</h3>
      <input type="text" id="product-name" placeholder="Product Name"><br>
      <input type="text" id="product-barcode" placeholder="Barcode (Optional)" readonly><br>
      <input type="date" id="expiry-date"><br>
      <button onclick="saveProduct()">Save Product</button>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
